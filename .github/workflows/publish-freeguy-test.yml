name: Publish MiTV Kids Shortcut Test APK

on:
  push:
    branches: [freeguy]
    paths: [.github/workflows/publish-freeguy-test.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the already-verified test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39534853682 --repo "${{ github.repository }}" --name mitv-kids-shortcut-debug --dir out
      - name: Publish clearly labeled prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s out/app-debug.apk
          sha256sum out/app-debug.apk
          gh release create mitv-kids-shortcut-smoke-20261021 'out/app-debug.apk#mitv-kids-shortcut.apk' \
            --repo "${{ github.repository }}" \
            --target 2077e687ae7470a12d1df4340f48f07068ae37b8 \
            --title "MiTV Kids Shortcut — standalone test APK" \
            --notes "Standalone APK from successful workflow 39534853682. Launches the real Xiaomi HOME_PAGE children tab (page=儿童). No UnitedU dependency, no account or watch-history permissions. Test build only: launching from a third-party APK is not yet device-verified; debug signing is not stable for future in-place upgrades." \
            --prerelease
