name: Freeguy build

on:
  push:
    branches: [freeguy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Preserve test APK
        uses: actions/upload-artifact@v4
        with:
          name: unitedu-freeguy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
